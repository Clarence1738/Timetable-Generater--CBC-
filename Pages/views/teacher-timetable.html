<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../../css/shared-pages.min.css?v=1.0">
    <script src="https://unpkg.com/sweetalert/dist/sweetalert.min.js"></script>
    <title>Teacher Timetable</title>
</head>

<body>
    <div id="sidebar-container" data-active="teacher-timetable"></div>

    <div class="content">
        <nav>
            <i class='bx bx-menu'></i>
            <form action="#">
                <div class="form-input">
                    <input type="search" placeholder="Search...">
                    <button class="search-btn" type="submit"><i class='bx bx-search'></i></button>
                </div>
            </form>
            <input type="checkbox" id="theme-toggle" hidden>
            <label for="theme-toggle" class="theme-toggle"></label>
            <a href="#" class="notif">
                <i class='bx bx-bell'></i>
                <span class="count">12</span>
            </a>
            <a href="#" class="profile">
                <img src="../../images/logo.png" alt="Logo" style="width: 32px; height: 32px; border-radius: 50%;">
            </a>
        </nav>

        <main>
            <div class="header">
                <div class="left">
                    <h1>Teacher Timetable</h1>
                    <ul class="breadcrumb">
                        <li><a href="#">Timetable</a></li>
                        /
                        <li><a href="#" class="active">teachers</a></li>
                    </ul>
                </div>
            </div>

            <div class="card">
                <h3>View Teacher Timetable</h3>
                <div class="row" style="margin-bottom: 12px;">
                    <label for="teacherSelect">Teacher</label>
                    <select id="teacherSelect">
                        <option value="">-- Select Teacher --</option>
                    </select>
                    <button class="btn-primary" id="viewBtn">View</button>
                    <button class="btn-secondary" id="printBtn" type="button">Print</button>
                </div>
                <div id="timetableView" class="muted">Select a teacher to view timetable.</div>
            </div>
        </main>
    </div>

    <script src="../../js/index.js"></script>
    <script src="../../js/load-sidebar.js"></script>
    <script src="../../js/shared-pages.min.js?v=1.3"></script>
</body>

</html>
