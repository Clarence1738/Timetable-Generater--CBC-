<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timetable Login</title>
    <link rel="stylesheet" href="../css/form.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="form-container login-container">
        <form action="../backend/public/index.php/auth/login" method="post" class="login-form">
            <div class="form-header">
                <div class="form-icon">
                    <i class="fas fa-graduation-cap"></i>
                </div>
                <h1>Timetable System</h1>
                <p class="form-subtitle">School Management Portal</p>
            </div>
            
            <div class="form-group">
                <label for="username">Username</label>
                <div class="input-wrapper">
                    <i class="fas fa-user"></i>
                    <input type="text" id="username" name="username" required placeholder="Enter your username" class="form-control">
                </div>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <div class="input-wrapper">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="password" name="password" required placeholder="Enter your password" class="form-control">
                </div>
            </div>

            <button type="submit" class="form-btn">
                <i class="fas fa-sign-in-alt"></i> Login
            </button>

            <div class="form-footer">
                <p><i class="fas fa-headset"></i> Need help? <a href="#">Contact the administrator</a></p>
            </div>
        </form>
    </div>
</body>
</html>
